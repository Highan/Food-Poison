name: food_poison
description: Aplikasi Food Poison untuk surplus food.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # API / HTTP
  http: ^1.5.0

  # Local Storage
  shared_preferences: ^2.5.3

  # Advanced Feature - Camera
  image_picker: ^1.1.2

  # Advanced Feature - Location
  geolocator: ^14.0.2

  # Advanced Feature - Authentication
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
